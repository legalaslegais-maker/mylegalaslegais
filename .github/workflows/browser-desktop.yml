name: Clean Temporary Windows RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rdp:
    runs-on: windows-2025
    timeout-minutes: 3500

    steps:
      - name: Configure RDP security
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty `
            'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections -Value 0

          Set-ItemProperty `
            'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name UserAuthentication -Value 1

          Set-ItemProperty `
            'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name SecurityLayer -Value 2

          Remove-NetFirewallRule `
            -DisplayName "RDP-Tailscale" `
            -ErrorAction SilentlyContinue

          New-NetFirewallRule `
            -DisplayName "RDP-Tailscale" `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress "100.64.0.0/10" `
            -Profile Any

          Set-Service TermService -StartupType Automatic
          Start-Service TermService

      - name: Create RDP account
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          # Replace with a unique, strong password.
          $password = "0405758923AA@@!!!!!!"

          if ($password -eq "0405758923AA@@!!!!!!" -or
              $password.Length -lt 16) {
            throw "Set a unique password of at least 16 characters."
          }

          $secure = ConvertTo-SecureString `
            $password -AsPlainText -Force

          if (-not (Get-LocalUser -Name RDP `
              -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name RDP `
              -Password $secure `
              -AccountNeverExpires | Out-Null
          } else {
            Set-LocalUser -Name RDP -Password $secure
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member RDP `
            -ErrorAction SilentlyContinue

      - name: Install official Tailscale client
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $file = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $url -OutFile $file

          $sig = Get-AuthenticodeSignature $file
          if ($sig.Status -ne "Valid" -or
              $sig.SignerCertificate.Subject -notmatch "Tailscale") {
            Remove-Item $file -Force -ErrorAction SilentlyContinue
            throw "Installer signature verification failed."
          }

          $proc = Start-Process msiexec.exe `
            -ArgumentList "/i `"$file`" /quiet /norestart" `
            -Wait -PassThru

          Remove-Item $file -Force

          if ($proc.ExitCode -notin @(0, 3010)) {
            throw "Tailscale installation failed."
          }

      - name: Connect private Tailscale network
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          # Paste your Tailscale auth key here.
          $authKey = "tskey-auth-kXYN6y36Yn11CNTRL-y7mjPsByebVu2Q4o5MbDbV9miLybLr1f"

          if ($authKey -eq "tskey-auth-kXYN6y36Yn11CNTRL-y7mjPsByebVu2Q4o5MbDbV9miLybLr1f") {
            throw "Insert your Tailscale auth key."
          }

          $exe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $exe up "--authkey=$authKey" `
            "--hostname=temporary-rdp-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed."
          }

          $ip = $null
          for ($i = 0; $i -lt 12 -and -not $ip; $i++) {
            Start-Sleep -Seconds 5
            $ip = (& $exe ip -4 | Select-Object -First 1)
          }

          if (-not $ip) {
            throw "Tailscale IP was not assigned."
          }

          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

      - name: Verify RDP
        shell: powershell
        run: |
          Write-Host "RDP address: $env:TAILSCALE_IP"
          Write-Host "Username: Davizinho20143"
          Write-Host "Use your configured RDP password."

          $test = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389

          if (-not $test.TcpTestSucceeded) {
            throw "RDP port test failed."
          }

          Write-Host "TCP port is reachable."

      - name: Keep session active
        shell: powershell
        run: |
          while ($true) {
            Write-Host "Temporary session active: $(Get-Date)"
            Start-Sleep -Seconds 300
          }
