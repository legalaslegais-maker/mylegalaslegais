
name: Temporary Windows Server 2022 Browser Desktop

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Configure Windows and install TightVNC
        shell: powershell
        env:
          WINDOWS_PASSWORD: ${{ secrets.WINDOWS_PASSWORD }}
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "STAGE 1: Validating secrets."

          $winPass = $env:WINDOWS_PASSWORD
          $vncPass = $env:VNC_PASSWORD

          if ([string]::IsNullOrWhiteSpace($winPass) -or
              $winPass.Length -lt 16) {
            throw "WINDOWS_PASSWORD must be at least 16 characters."
          }

          if ($vncPass -notmatch '^[A-Za-z0-9]{8}$') {
            throw "VNC_PASSWORD must be exactly 8 letters or numbers."
          }

          Write-Host "STAGE 2: Configuring the Windows account."

          $runnerUser = Get-LocalUser -Name "runneradmin" -ErrorAction Stop
          $securePassword = ConvertTo-SecureString `
            $winPass -AsPlainText -Force

          Set-LocalUser -Name $runnerUser.Name -Password $securePassword

          Write-Host "STAGE 3: Downloading TightVNC 2.8.90."

          $msi = Join-Path $env:TEMP "tightvnc.msi"

          Invoke-WebRequest `
            -Uri "https://www.tightvnc.com/download/2.8.90/tightvnc-2.8.90-gpl-setup-64bit.msi" `
            -OutFile $msi `
            -UseBasicParsing

          if (-not (Test-Path $msi) -or
              (Get-Item $msi).Length -lt 1000000) {
            throw "TightVNC installer download is incomplete."
          }

          Write-Host "STAGE 4: Installing the server and configuring authentication."

          $msiArgs = @(
            "/i"
            ('"{0}"' -f $msi)
            "/quiet"
            "/norestart"
            "ADDLOCAL=Server"
            "SERVER_REGISTER_AS_SERVICE=1"
            "SERVER_ADD_FIREWALL_EXCEPTION=0"
            "SET_ACCEPTRFBCONNECTIONS=1"
            "VALUE_OF_ACCEPTRFBCONNECTIONS=1"
            "SET_USEVNCAUTHENTICATION=1"
            "VALUE_OF_USEVNCAUTHENTICATION=1"
            "SET_PASSWORD=1"
            "VALUE_OF_PASSWORD=$vncPass"
            "SET_ALLOWLOOPBACK=1"
            "VALUE_OF_ALLOWLOOPBACK=1"
            "SET_LOOPBACKONLY=1"
            "VALUE_OF_LOOPBACKONLY=1"
            "SET_ACCEPTHTTPCONNECTIONS=1"
            "VALUE_OF_ACCEPTHTTPCONNECTIONS=0"
            "SET_POLLINGINTERVAL=1"
            "VALUE_OF_POLLINGINTERVAL=250"
            "SET_REMOVEWALLPAPER=1"
            "VALUE_OF_REMOVEWALLPAPER=1"
            "SET_ALWAYSSHARED=1"
            "VALUE_OF_ALWAYSSHARED=1"
            "SET_DISCONNECTACTION=1"
            "VALUE_OF_DISCONNECTACTION=0"
          ) -join " "

          $install = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList $msiArgs `
            -Wait `
            -PassThru

          Remove-Item $msi -Force -ErrorAction SilentlyContinue

          if ($install.ExitCode -notin @(0, 3010)) {
            throw "TightVNC installation failed with exit code $($install.ExitCode)."
          }

          Write-Host "STAGE 5: Starting and checking the VNC service."

          $service = Get-Service -Name "tvnserver" `
            -ErrorAction SilentlyContinue

          if ($null -eq $service) {
            $service = Get-Service |
              Where-Object { $_.DisplayName -match "TightVNC" } |
              Select-Object -First 1
          }

          if ($null -eq $service) {
            throw "TightVNC service was not found."
          }

          Set-Service -Name $service.Name -StartupType Automatic

          if ($service.Status -eq "Running") {
            Restart-Service -Name $service.Name -Force
          } else {
            Start-Service -Name $service.Name
          }

          $vncReady = $false

          for ($i = 0; $i -lt 30; $i++) {
            $vncReady = Test-NetConnection `
              -ComputerName "127.0.0.1" `
              -Port 5900 `
              -InformationLevel Quiet `
              -WarningAction SilentlyContinue

            if ($vncReady) {
              break
            }

            Start-Sleep -Seconds 2
          }

          if (-not $vncReady) {
            throw "TightVNC did not listen on 127.0.0.1:5900."
          }

          Write-Host "SUCCESS: TightVNC is listening locally."

      - name: Install noVNC and start browser gateway
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "STAGE 6: Downloading noVNC 1.6.0."

          $zip = Join-Path $env:TEMP "novnc.zip"
          $novncDir = Join-Path $env:TEMP "noVNC-1.6.0"

          Invoke-WebRequest `
            -Uri "https://github.com/novnc/noVNC/archive/refs/tags/v1.6.0.zip" `
            -OutFile $zip `
            -UseBasicParsing

          Expand-Archive -Path $zip `
            -DestinationPath $env:TEMP -Force

          Remove-Item $zip -Force

          if (-not (Test-Path (Join-Path $novncDir "vnc.html"))) {
            throw "noVNC vnc.html was not found."
          }

          Write-Host "STAGE 7: Installing a pinned websockify version."

          python -m pip install `
            --disable-pip-version-check `
            "websockify==0.13.0"

          if ($LASTEXITCODE -ne 0) {
            throw "websockify installation failed."
          }

          Write-Host "STAGE 8: Configuring the default browser page."

          $indexHtml = @'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Windows Cloud Desktop</title>
            <script>
              window.location.replace(
                "/vnc.html#autoconnect=true&reconnect=true&reconnect_delay=3000&resize=scale&quality=5&compression=6&path=websockify"
              );
            </script>
            <meta http-equiv="refresh" content="0;url=/vnc.html">
          </head>
          <body>
            Opening your cloud desktop...
            <a href="/vnc.html">Open noVNC</a>
          </body>
          </html>
          '@

          Set-Content `
            -LiteralPath (Join-Path $novncDir "index.html") `
            -Value $indexHtml `
            -Encoding UTF8

          Write-Host "STAGE 9: Starting the WebSocket gateway."

          $pythonExe = (Get-Command python -ErrorAction Stop).Source
          $proxyOut = Join-Path $env:TEMP "websockify-out.log"
          $proxyErr = Join-Path $env:TEMP "websockify-err.log"

          $proxyArgs = '-m websockify --web "' +
            $novncDir +
            '" --heartbeat 15 127.0.0.1:6080 127.0.0.1:5900'

          $proxy = Start-Process `
            -FilePath $pythonExe `
            -ArgumentList $proxyArgs `
            -WindowStyle Hidden `
            -RedirectStandardOutput $proxyOut `
            -RedirectStandardError $proxyErr `
            -PassThru

          $webReady = $false

          for ($i = 0; $i -lt 30; $i++) {
            if ($proxy.HasExited) {
              if (Test-Path $proxyOut) { Get-Content $proxyOut }
              if (Test-Path $proxyErr) { Get-Content $proxyErr }
              throw "Websockify exited unexpectedly."
            }

            $webReady = Test-NetConnection `
              -ComputerName "127.0.0.1" `
              -Port 6080 `
              -InformationLevel Quiet `
              -WarningAction SilentlyContinue

            if ($webReady) {
              break
            }

            Start-Sleep -Seconds 2
          }

          if (-not $webReady) {
            if (Test-Path $proxyErr) { Get-Content $proxyErr }
            throw "The noVNC gateway did not start on port 6080."
          }

          $response = Invoke-WebRequest `
            -Uri "http://127.0.0.1:6080/" `
            -UseBasicParsing `
            -TimeoutSec 15

          if ($response.StatusCode -ne 200) {
            throw "The noVNC homepage did not return HTTP 200."
          }

          Write-Host "SUCCESS: Browser gateway is running."

      - name: Start Cloudflare Quick Tunnel
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "STAGE 10: Downloading Cloudflare Tunnel."

          $cloudflared = Join-Path $env:TEMP "cloudflared.exe"

          Invoke-WebRequest `
            -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile $cloudflared `
            -UseBasicParsing

          if (-not (Test-Path $cloudflared) -or
              (Get-Item $cloudflared).Length -lt 1000000) {
            throw "Cloudflare Tunnel download appears incomplete."
          }

          Write-Host "STAGE 11: Opening your temporary browser desktop."
          Write-Host "Find the trycloudflare.com URL below."
          Write-Host "Open that URL in Chrome. The root page redirects to noVNC."
          Write-Host "Keep this workflow running for the entire session."

          & $cloudflared tunnel `
            --no-autoupdate `
            --protocol http2 `
            --url "http://127.0.0.1:6080"

          if ($LASTEXITCODE -ne 0) {
            throw "Cloudflare Tunnel exited with code $LASTEXITCODE."
          }
