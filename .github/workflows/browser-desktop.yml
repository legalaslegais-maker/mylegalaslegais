
name: Temporary Windows Browser Desktop

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    runs-on: windows-2025
    timeout-minutes: 350

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install and configure TightVNC
        shell: powershell
        env:
          WINDOWS_PASSWORD: ${{ secrets.WINDOWS_PASSWORD }}
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "STAGE 1: Validating secrets."

          $winPass = $env:WINDOWS_PASSWORD
          $vncPass = $env:VNC_PASSWORD

          if ([string]::IsNullOrWhiteSpace($winPass) -or $winPass.Length -lt 16) {
            throw "WINDOWS_PASSWORD is missing or shorter than 16 characters."
          }

          if ($vncPass -notmatch '^[A-Za-z0-9]{8}$') {
            throw "VNC_PASSWORD must contain exactly 8 letters or numbers."
          }

          Write-Host "STAGE 2: Configuring the temporary Windows account."

          $runnerUser = Get-LocalUser -Name "runneradmin" -ErrorAction Stop
          $securePassword = ConvertTo-SecureString $winPass -AsPlainText -Force
          Set-LocalUser -Name $runnerUser.Name -Password $securePassword

          Write-Host "STAGE 3: Downloading official TightVNC MSI."

          $msi = Join-Path $env:TEMP "tightvnc.msi"
          $url = "https://www.tightvnc.com/download/2.8.90/tightvnc-2.8.90-gpl-setup-64bit.msi"

          Invoke-WebRequest -Uri $url -OutFile $msi -UseBasicParsing

          if (-not (Test-Path $msi) -or (Get-Item $msi).Length -lt 1000000) {
            throw "The TightVNC installer download appears incomplete."
          }

          Write-Host "STAGE 4: Installing the VNC server."

          $msiArgs = @(
            "/i"
            "`"$msi`""
            "/quiet"
            "/norestart"
            "ADDLOCAL=Server"
            "SERVER_REGISTER_AS_SERVICE=1"
            "SERVER_ADD_FIREWALL_EXCEPTION=0"
            "SET_ACCEPTRFBCONNECTIONS=1"
            "VALUE_OF_ACCEPTRFBCONNECTIONS=1"
            "SET_ALLOWLOOPBACK=1"
            "VALUE_OF_ALLOWLOOPBACK=1"
            "SET_LOOPBACKONLY=1"
            "VALUE_OF_LOOPBACKONLY=1"
            "SET_ACCEPTHTTPCONNECTIONS=1"
            "VALUE_OF_ACCEPTHTTPCONNECTIONS=0"
            "SET_USEVNCAUTHENTICATION=1"
            "VALUE_OF_USEVNCAUTHENTICATION=1"
            "SET_PASSWORD=1"
            "VALUE_OF_PASSWORD=$vncPass"
          ) -join " "

          $installer = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList $msiArgs `
            -Wait `
            -PassThru

          Remove-Item $msi -Force -ErrorAction SilentlyContinue

          if ($installer.ExitCode -notin @(0, 3010)) {
            throw "TightVNC MSI failed with exit code $($installer.ExitCode)."
          }

          Write-Host "STAGE 5: Starting the VNC service."

          $service = Get-Service -Name "tvnserver" -ErrorAction SilentlyContinue

          if ($null -eq $service) {
            $service = Get-Service |
              Where-Object { $_.DisplayName -match "TightVNC" } |
              Select-Object -First 1
          }

          if ($null -eq $service) {
            throw "TightVNC service was not found after installation."
          }

          Set-Service -Name $service.Name -StartupType Automatic
          Start-Service -Name $service.Name

          $vncReady = $false

          for ($i = 0; $i -lt 30; $i++) {
            $vncReady = Test-NetConnection `
              -ComputerName "127.0.0.1" `
              -Port 5900 `
              -InformationLevel Quiet `
              -WarningAction SilentlyContinue

            if ($vncReady) {
              break
            }

            Start-Sleep -Seconds 2
          }

          if (-not $vncReady) {
            throw "TightVNC is not listening on localhost port 5900. Check the service configuration."
          }

          Write-Host "SUCCESS: VNC server is responding on localhost:5900."

      - name: Start noVNC browser desktop and Cloudflare tunnel
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "STAGE 6: Downloading noVNC."

          $zip = Join-Path $env:TEMP "novnc.zip"
          $novncDir = Join-Path $env:TEMP "noVNC-1.7.0"

          Invoke-WebRequest `
            -Uri "https://github.com/novnc/noVNC/archive/refs/tags/v1.7.0.zip" `
            -OutFile $zip `
            -UseBasicParsing

          Expand-Archive -Path $zip -DestinationPath $env:TEMP -Force
          Remove-Item $zip -Force

          if (-not (Test-Path (Join-Path $novncDir "vnc.html"))) {
            throw "noVNC vnc.html was not found after extracting the download."
          }

          Write-Host "STAGE 7: Installing websockify."

          python -m pip install --disable-pip-version-check --upgrade websockify

          if ($LASTEXITCODE -ne 0) {
            throw "Installing websockify failed with exit code $LASTEXITCODE."
          }

          Write-Host "STAGE 8: Starting the browser gateway."

          $pythonExe = (Get-Command python -ErrorAction Stop).Source
          $proxyOut = Join-Path $env:TEMP "websockify-out.log"
          $proxyErr = Join-Path $env:TEMP "websockify-err.log"

          $proxyArgs = '-m websockify --web "' +
            $novncDir +
            '" --heartbeat 30 6080 127.0.0.1:5900'

          $proxy = Start-Process `
            -FilePath $pythonExe `
            -ArgumentList $proxyArgs `
            -WindowStyle Hidden `
            -RedirectStandardOutput $proxyOut `
            -RedirectStandardError $proxyErr `
            -PassThru

          $webReady = $false

          for ($i = 0; $i -lt 30; $i++) {
            if ($proxy.HasExited) {
              Write-Host "Websockify standard output:"
              if (Test-Path $proxyOut) { Get-Content $proxyOut }
              Write-Host "Websockify error output:"
              if (Test-Path $proxyErr) { Get-Content $proxyErr }
              throw "Websockify stopped unexpectedly with exit code $($proxy.ExitCode)."
            }

            $webReady = Test-NetConnection `
              -ComputerName "127.0.0.1" `
              -Port 6080 `
              -InformationLevel Quiet `
              -WarningAction SilentlyContinue

            if ($webReady) {
              break
            }

            Start-Sleep -Seconds 2
          }

          if (-not $webReady) {
            if (Test-Path $proxyOut) { Get-Content $proxyOut }
            if (Test-Path $proxyErr) { Get-Content $proxyErr }
            throw "The noVNC gateway did not start on port 6080."
          }

          $page = Invoke-WebRequest `
            -Uri "http://127.0.0.1:6080/vnc.html" `
            -UseBasicParsing `
            -TimeoutSec 15

          if ($page.StatusCode -ne 200) {
            throw "The noVNC browser page did not return HTTP 200."
          }

          Write-Host "SUCCESS: noVNC is serving the browser page."

          Write-Host "STAGE 9: Downloading Cloudflare Tunnel."

          $cloudflared = Join-Path $env:TEMP "cloudflared.exe"

          Invoke-WebRequest `
            -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile $cloudflared `
            -UseBasicParsing

          if (-not (Test-Path $cloudflared) -or
              (Get-Item $cloudflared).Length -lt 1000000) {
            throw "Cloudflare Tunnel download appears incomplete."
          }

          Write-Host "STAGE 10: Starting the temporary tunnel."
          Write-Host "Watch the next Cloudflare output for the trycloudflare.com URL."
          Write-Host "Open that URL followed by /vnc.html in your browser."
          Write-Host "Keep this workflow running while using the desktop."

          & $cloudflared tunnel `
            --no-autoupdate `
            --url "http://127.0.0.1:6080"

          if ($LASTEXITCODE -ne 0) {
            throw "Cloudflare Tunnel exited with code $LASTEXITCODE."
          }
