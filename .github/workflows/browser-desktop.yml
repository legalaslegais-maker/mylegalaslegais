
name: Temporary Windows Server 2022 Browser Desktop

on:
  workflow_dispatch:

permissions: {}

jobs:
  desktop:
    runs-on: windows-2025-vs2026
    timeout-minutes: 3500000000

    steps:
      - name: Install TightVNC and configure application-mode password
        shell: powershell
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "STAGE 1: Validate password."

          $vncPass = $env:VNC_PASSWORD

          if ($vncPass -notmatch '^[A-Za-z0-9]{8}$') {
            throw "Set VNC_PASSWORD to exactly 8 letters or numbers."
          }

          Write-Host "STAGE 2: Download TightVNC."

          $msi = Join-Path $env:TEMP "tightvnc.msi"

          Invoke-WebRequest `
            -Uri "https://www.tightvnc.com/download/2.8.90/tightvnc-2.8.90-gpl-setup-64bit.msi" `
            -OutFile $msi `
            -UseBasicParsing

          if (-not (Test-Path $msi) -or
              (Get-Item $msi).Length -lt 1000000) {
            throw "TightVNC download is incomplete."
          }

          Write-Host "STAGE 3: Install the VNC server without service mode."

          $msiArgs = @(
            "/i"
            ('"{0}"' -f $msi)
            "/quiet"
            "/norestart"
            "ADDLOCAL=Server"
            "SERVER_REGISTER_AS_SERVICE=0"
            "SERVER_ADD_FIREWALL_EXCEPTION=0"
          ) -join " "

          $installer = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList $msiArgs `
            -Wait `
            -PassThru

          Remove-Item $msi -Force -ErrorAction SilentlyContinue

          if ($installer.ExitCode -notin @(0, 3010)) {
            throw "TightVNC installation failed: $($installer.ExitCode)."
          }

          # Stop any service-mode instance that may have been installed.
          $service = Get-Service -Name "tvnserver" `
            -ErrorAction SilentlyContinue

          if ($service -and $service.Status -eq "Running") {
            Stop-Service -Name $service.Name -Force
            Start-Sleep -Seconds 2
          }

          $tvn = Join-Path $env:ProgramFiles "TightVNC\tvnserver.exe"

          if (-not (Test-Path $tvn)) {
            throw "TightVNC server executable was not found."
          }

          Write-Host "STAGE 4: Configure this user's TightVNC settings."

          $appKey = "HKCU:\Software\TightVNC\Server"
          New-Item -Path $appKey -Force | Out-Null

          # TightVNC stores its legacy VNC password as an encrypted
          # 8-byte value. This configuration is for application mode.
          $plainBytes = [System.Text.Encoding]::ASCII.GetBytes($vncPass)

          $des = [System.Security.Cryptography.DES]::Create()
          $des.Key = [byte[]]@(0xE8, 0x4A, 0xD6, 0x60, 0xC4, 0x72, 0x1A, 0xE0)
          $des.IV = [byte[]]@(0, 0, 0, 0, 0, 0, 0, 0)
          $des.Mode = [System.Security.Cryptography.CipherMode]::CBC
          $des.Padding = [System.Security.Cryptography.PaddingMode]::None

          $encryptor = $des.CreateEncryptor()

          try {
            $encryptedPassword = $encryptor.TransformFinalBlock(
              $plainBytes, 0, $plainBytes.Length
            )
          }
          finally {
            $encryptor.Dispose()
            $des.Dispose()
          }

          New-ItemProperty `
            -Path $appKey `
            -Name "Password" `
            -PropertyType Binary `
            -Value $encryptedPassword `
            -Force | Out-Null

          $settings = @{
            UseVncAuthentication = 1
            AcceptRfbConnections = 1
            RfbPort = 5900
            SocketConnect = 1
            AutoPortSelect = 0
            LoopbackOnly = 1
            AllowLoopback = 1
            RunAsService = 0
            RemoveWallpaper = 1
            AlwaysShared = 1
            NeverShared = 0
            DisconnectClients = 0
            AcceptHttpConnections = 0
            QueryConnect = 0
          }

          foreach ($entry in $settings.GetEnumerator()) {
            New-ItemProperty `
              -Path $appKey `
              -Name $entry.Key `
              -PropertyType DWord `
              -Value $entry.Value `
              -Force | Out-Null
          }

          Write-Host "SUCCESS: Application-mode VNC configuration written."
          Write-Host "VNC password was not printed."

      - name: Start interactive desktop, noVNC, and Cloudflare tunnel
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $work = Join-Path $env:TEMP "browser-desktop"
          New-Item -ItemType Directory -Path $work -Force | Out-Null

          Write-Host "STAGE 5: Diagnose the Windows desktop session."

          $shellSession = (Get-Process -Id $PID).SessionId
          Write-Host "PowerShell session ID: $shellSession"
          Write-Host "SESSIONNAME: $env:SESSIONNAME"
          Write-Host "Current Windows user:"
          whoami
          Write-Host "Windows sessions:"
          query session 2>&1

          Add-Type @"
          using System.Runtime.InteropServices;
          public static class DesktopSessionInfo {
            [DllImport("kernel32.dll")]
            public static extern uint WTSGetActiveConsoleSessionId();
          }
          "@

          $activeConsole = [DesktopSessionInfo]::WTSGetActiveConsoleSessionId()
          Write-Host "Active console session ID: $activeConsole"

          if ($shellSession -eq 0 -or $shellSession -ne $activeConsole) {
            Write-Warning "The Actions process may not be attached to the active interactive desktop. VNC input cannot be guaranteed in this session."
          }

          $explorer = Get-Process explorer -ErrorAction SilentlyContinue |
            Where-Object { $_.SessionId -eq $shellSession } |
            Select-Object -First 1

          if (-not $explorer) {
            Write-Host "Explorer is not running in this session; attempting to start it."
            Start-Process "$env:WINDIR\explorer.exe"
            Start-Sleep -Seconds 3
          }

          Write-Host "STAGE 6: Start TightVNC in application mode."

          $tvn = Join-Path $env:ProgramFiles "TightVNC\tvnserver.exe"

          $vncProcess = Start-Process `
            -FilePath $tvn `
            -ArgumentList "-run" `
            -PassThru

          Start-Sleep -Seconds 3

          if ($vncProcess.HasExited) {
            throw "TightVNC application mode exited immediately."
          }

          $vncReady = $false

          for ($i = 0; $i -lt 30; $i++) {
            $vncReady = Test-NetConnection `
              -ComputerName "127.0.0.1" `
              -Port 5900 `
              -InformationLevel Quiet `
              -WarningAction SilentlyContinue

            if ($vncReady) {
              break
            }

            Start-Sleep -Seconds 2
          }

          if (-not $vncReady) {
            throw "Application-mode VNC did not listen on localhost:5900."
          }

          $vncSession = (Get-Process -Id $vncProcess.Id).SessionId
          Write-Host "TightVNC process session ID: $vncSession"

          if ($vncSession -ne $shellSession) {
            throw "TightVNC is running in a different session from the workflow shell."
          }

          Write-Host "STAGE 7: Download noVNC."

          $zip = Join-Path $work "novnc.zip"
          $novncDir = Join-Path $work "noVNC-1.7.0"

          Invoke-WebRequest `
            -Uri "https://github.com/novnc/noVNC/archive/refs/tags/v1.7.0.zip" `
            -OutFile $zip `
            -UseBasicParsing

          Expand-Archive -Path $zip `
            -DestinationPath $work -Force

          Remove-Item $zip -Force

          if (-not (Test-Path (Join-Path $novncDir "vnc.html"))) {
            throw "noVNC vnc.html was not found."
          }

          Write-Host "STAGE 8: Install websockify."

          python -m pip install `
            --disable-pip-version-check `
            "websockify==0.13.0"

          if ($LASTEXITCODE -ne 0) {
            throw "websockify installation failed."
          }

          $indexHtml = @'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Windows Desktop</title>
            <script>
              window.location.replace(
                "/vnc.html?autoconnect=true&reconnect=true&reconnect_delay=3000&resize=scale&quality=5&compression=6&path=websockify"
              );
            </script>
          </head>
          <body>
            <p>Opening Windows desktop...</p>
            <a href="/vnc.html">Open noVNC</a>
          </body>
          </html>
          '@

          Set-Content `
            -LiteralPath (Join-Path $novncDir "index.html") `
            -Value $indexHtml `
            -Encoding UTF8

          Write-Host "STAGE 9: Start the WebSocket proxy."

          $pythonExe = (Get-Command python -ErrorAction Stop).Source
          $proxyOut = Join-Path $work "websockify-out.log"
          $proxyErr = Join-Path $work "websockify-err.log"

          $proxyArgs = '-m websockify --web "' +
            $novncDir +
            '" --heartbeat 15 127.0.0.1:6080 127.0.0.1:5900'

          $proxy = Start-Process `
            -FilePath $pythonExe `
            -ArgumentList $proxyArgs `
            -RedirectStandardOutput $proxyOut `
            -RedirectStandardError $proxyErr `
            -WindowStyle Hidden `
            -PassThru

          $webReady = $false

          for ($i = 0; $i -lt 30; $i++) {
            if ($proxy.HasExited) {
              if (Test-Path $proxyOut) { Get-Content $proxyOut }
              if (Test-Path $proxyErr) { Get-Content $proxyErr }
              throw "Websockify exited unexpectedly."
            }

            try {
              $page = Invoke-WebRequest `
                -Uri "http://127.0.0.1:6080/vnc.html" `
                -UseBasicParsing `
                -TimeoutSec 5

              if ($page.StatusCode -eq 200) {
                $webReady = $true
                break
              }
            }
            catch {
              Start-Sleep -Seconds 2
            }
          }

          if (-not $webReady) {
            if (Test-Path $proxyOut) { Get-Content $proxyOut }
            if (Test-Path $proxyErr) { Get-Content $proxyErr }
            throw "The local noVNC page is not responding."
          }

          Write-Host "SUCCESS: noVNC is serving HTTP on localhost:6080."

          Write-Host "STAGE 10: Download Cloudflare Tunnel."

          $cloudflared = Join-Path $work "cloudflared.exe"

          Invoke-WebRequest `
            -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile $cloudflared `
            -UseBasicParsing

          if ((Get-Item $cloudflared).Length -lt 1000000) {
            throw "Cloudflare Tunnel download is incomplete."
          }

          Write-Host "STAGE 11: Starting the tunnel with HTTP/2."
          Write-Host "Copy the new trycloudflare.com URL printed below."
          Write-Host "Open it in Chrome. Enter your VNC_PASSWORD when prompted."
          Write-Host "Keep this workflow running while using the desktop."

          & $cloudflared tunnel `
            --no-autoupdate `
            --protocol http2 `
            --url "http://127.0.0.1:6080"

          if ($LASTEXITCODE -ne 0) {
            throw "Cloudflare Tunnel exited with code $LASTEXITCODE."
          }
