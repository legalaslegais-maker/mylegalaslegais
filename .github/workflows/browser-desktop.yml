
name: Temporary Windows Server 2022 Browser Desktop

on:
  workflow_dispatch:

permissions: {}

jobs:
  desktop:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Install and configure TightVNC
        shell: powershell
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "STAGE 1: Validate VNC password."

          $vncPass = $env:VNC_PASSWORD

          if ($vncPass -notmatch '^[A-Za-z0-9]{8}$') {
            throw "VNC_PASSWORD must be exactly 8 letters or numbers."
          }

          Write-Host "STAGE 2: Download TightVNC."

          $msi = Join-Path $env:TEMP "tightvnc.msi"

          Invoke-WebRequest `
            -Uri "https://www.tightvnc.com/download/2.8.90/tightvnc-2.8.90-gpl-setup-64bit.msi" `
            -OutFile $msi `
            -UseBasicParsing

          if (-not (Test-Path $msi) -or
              (Get-Item $msi).Length -lt 1000000) {
            throw "TightVNC installer download is incomplete."
          }

          Write-Host "STAGE 3: Install VNC server and set authentication."

          $msiArgs = @(
            "/i"
            ('"{0}"' -f $msi)
            "/quiet"
            "/norestart"
            "ADDLOCAL=Server"
            "SERVER_REGISTER_AS_SERVICE=1"
            "SERVER_ADD_FIREWALL_EXCEPTION=0"
            "SET_ACCEPTRFBCONNECTIONS=1"
            "VALUE_OF_ACCEPTRFBCONNECTIONS=1"
            "SET_USEVNCAUTHENTICATION=1"
            "VALUE_OF_USEVNCAUTHENTICATION=1"
            "SET_PASSWORD=1"
            "VALUE_OF_PASSWORD=$vncPass"
            "SET_ALLOWLOOPBACK=1"
            "VALUE_OF_ALLOWLOOPBACK=1"
            "SET_LOOPBACKONLY=1"
            "VALUE_OF_LOOPBACKONLY=1"
            "SET_ACCEPTHTTPCONNECTIONS=1"
            "VALUE_OF_ACCEPTHTTPCONNECTIONS=0"
            "SET_ALWAYSSHARED=1"
            "VALUE_OF_ALWAYSSHARED=1"
            "SET_DISCONNECTACTION=1"
            "VALUE_OF_DISCONNECTACTION=0"
            "SET_POLLINGINTERVAL=1"
            "VALUE_OF_POLLINGINTERVAL=500"
            "SET_REMOVEWALLPAPER=1"
            "VALUE_OF_REMOVEWALLPAPER=1"
          ) -join " "

          $install = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList $msiArgs `
            -Wait `
            -PassThru

          Remove-Item $msi -Force -ErrorAction SilentlyContinue

          if ($install.ExitCode -notin @(0, 3010)) {
            throw "TightVNC installation failed: exit code $($install.ExitCode)."
          }

          Write-Host "STAGE 4: Start VNC service."

          $service = Get-Service -Name "tvnserver" `
            -ErrorAction SilentlyContinue

          if ($null -eq $service) {
            $service = Get-Service |
              Where-Object { $_.DisplayName -match "TightVNC" } |
              Select-Object -First 1
          }

          if ($null -eq $service) {
            throw "TightVNC service was not found."
          }

          Set-Service -Name $service.Name -StartupType Automatic

          Stop-Service -Name $service.Name `
            -Force -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 2
          Start-Service -Name $service.Name

          $ready = $false

          for ($i = 0; $i -lt 30; $i++) {
            $ready = Test-NetConnection `
              -ComputerName "127.0.0.1" `
              -Port 5900 `
              -InformationLevel Quiet `
              -WarningAction SilentlyContinue

            if ($ready) {
              break
            }

            Start-Sleep -Seconds 2
          }

          if (-not $ready) {
            throw "VNC did not start on 127.0.0.1:5900."
          }

          Write-Host "SUCCESS: TightVNC is listening on localhost:5900."

      - name: Start browser desktop and Cloudflare tunnel
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $work = Join-Path $env:TEMP "browser-desktop"
          New-Item -ItemType Directory -Path $work -Force | Out-Null

          Write-Host "STAGE 5: Download noVNC 1.7.0."

          $zip = Join-Path $work "novnc.zip"
          $novncDir = Join-Path $work "noVNC-1.7.0"

          Invoke-WebRequest `
            -Uri "https://github.com/novnc/noVNC/archive/refs/tags/v1.7.0.zip" `
            -OutFile $zip `
            -UseBasicParsing

          Expand-Archive -Path $zip `
            -DestinationPath $work -Force

          Remove-Item $zip -Force

          if (-not (Test-Path (Join-Path $novncDir "vnc.html"))) {
            throw "noVNC vnc.html was not found."
          }

          Write-Host "STAGE 6: Install websockify."

          python -m pip install `
            --disable-pip-version-check `
            "websockify==0.13.0"

          if ($LASTEXITCODE -ne 0) {
            throw "websockify installation failed."
          }

          Write-Host "STAGE 7: Configure the desktop landing page."

          $indexHtml = @'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Windows Cloud Desktop</title>
            <script>
              window.location.replace(
                "/vnc.html#autoconnect=true&reconnect=true&reconnect_delay=3000&resize=scale&quality=5&compression=6&path=websockify"
              );
            </script>
          </head>
          <body>
            <p>Opening desktop...</p>
            <a href="/vnc.html">Open noVNC</a>
          </body>
          </html>
          '@

          Set-Content `
            -LiteralPath (Join-Path $novncDir "index.html") `
            -Value $indexHtml `
            -Encoding UTF8

          Write-Host "STAGE 8: Start the WebSocket gateway."

          $pythonExe = (Get-Command python -ErrorAction Stop).Source
          $proxyOut = Join-Path $work "websockify-out.log"
          $proxyErr = Join-Path $work "websockify-err.log"

          $proxyArgs = '-m websockify --web "' +
            $novncDir +
            '" --heartbeat 15 127.0.0.1:6080 127.0.0.1:5900'

          $proxy = Start-Process `
            -FilePath $pythonExe `
            -ArgumentList $proxyArgs `
            -RedirectStandardOutput $proxyOut `
            -RedirectStandardError $proxyErr `
            -WindowStyle Hidden `
            -PassThru

          $ready = $false

          for ($i = 0; $i -lt 30; $i++) {
            if ($proxy.HasExited) {
              if (Test-Path $proxyOut) { Get-Content $proxyOut }
              if (Test-Path $proxyErr) { Get-Content $proxyErr }
              throw "Websockify exited unexpectedly."
            }

            try {
              $page = Invoke-WebRequest `
                -Uri "http://127.0.0.1:6080/vnc.html" `
                -UseBasicParsing `
                -TimeoutSec 5

              if ($page.StatusCode -eq 200) {
                $ready = $true
                break
              }
            } catch {
              Start-Sleep -Seconds 2
            }
          }

          if (-not $ready) {
            if (Test-Path $proxyOut) { Get-Content $proxyOut }
            if (Test-Path $proxyErr) { Get-Content $proxyErr }
            throw "The local noVNC page did not become ready."
          }

          Write-Host "SUCCESS: noVNC is serving HTTP on localhost:6080."

          Write-Host "STAGE 9: Download Cloudflare Tunnel."

          $cloudflared = Join-Path $work "cloudflared.exe"

          Invoke-WebRequest `
            -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile $cloudflared `
            -UseBasicParsing

          if (-not (Test-Path $cloudflared) -or
              (Get-Item $cloudflared).Length -lt 1000000) {
            throw "Cloudflare Tunnel download is incomplete."
          }

          Write-Host "STAGE 10: Start Cloudflare using HTTP/2."
          Write-Host "Copy the URL created by THIS workflow run."
          Write-Host "Open the URL in Chrome, or add /vnc.html."
          Write-Host "Leave this step running while using the desktop."

          & $cloudflared tunnel `
            --no-autoupdate `
            --protocol http2 `
            --url "http://127.0.0.1:6080"

          if ($LASTEXITCODE -ne 0) {
            throw "Cloudflare Tunnel exited with code $LASTEXITCODE."
          }
