
name: Temporary Windows Browser Desktop

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    runs-on: windows-2025
    timeout-minutes: 350

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Windows and install UltraVNC
        shell: powershell
        env:
          WINDOWS_PASSWORD: ${{ secrets.WINDOWS_PASSWORD }}
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $winPass = $env:WINDOWS_PASSWORD
          $vncPass = $env:VNC_PASSWORD

          if ([string]::IsNullOrWhiteSpace($winPass) -or $winPass.Length -lt 16) {
            throw "Set WINDOWS_PASSWORD to a unique password of at least 16 characters."
          }

          if ($vncPass -notmatch '^[A-Za-z0-9]{8}$') {
            throw "VNC_PASSWORD must contain exactly 8 letters or numbers."
          }

          $runnerUser = Get-LocalUser -Name "runneradmin" -ErrorAction Stop
          $secureWinPass = ConvertTo-SecureString $winPass -AsPlainText -Force

          Set-LocalUser -Name $runnerUser.Name -Password $secureWinPass

          $installer = Join-Path $env:TEMP "UltraVNC_1829_x64_Setup.exe"
          $installerUrl = "https://uvnc.eu/download/1800/UltraVNC_1829_x64_Setup.exe"

          Invoke-WebRequest -Uri $installerUrl -OutFile $installer

          $installArgs = '/VERYSILENT /SP- /NORESTART /COMPONENTS="UltraVNC_Server" /TASKS="installservice,startservice" /setpasswd=' + $vncPass

          $installProcess = Start-Process `
            -FilePath $installer `
            -ArgumentList $installArgs `
            -Wait `
            -PassThru

          Remove-Item $installer -Force -ErrorAction SilentlyContinue

          if ($installProcess.ExitCode -ne 0) {
            throw "UltraVNC installation failed with exit code $($installProcess.ExitCode)."
          }

          $service = Get-Service -Name "uvnc_service" -ErrorAction SilentlyContinue

          if ($null -eq $service) {
            throw "UltraVNC service was not installed. Check the installer and its logs."
          }

          Stop-Service -Name $service.Name -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          $iniPath = Join-Path $env:ProgramData "UltraVNC\ultravnc.ini"

          if (-not (Test-Path $iniPath)) {
            throw "UltraVNC configuration was not found at $iniPath."
          }

          function Set-IniValue {
            param(
              [string]$Content,
              [string]$Section,
              [string]$Key,
              [string]$Value
            )

            $sectionPattern = "(?ims)^\[$([regex]::Escape($Section))\]\r?\n.*?(?=^\[|\z)"
            $match = [regex]::Match($Content, $sectionPattern)

            if ($match.Success) {
              $block = $match.Value
              $keyPattern = "(?im)^\s*$([regex]::Escape($Key))\s*=.*$"

              if ([regex]::IsMatch($block, $keyPattern)) {
                $block = [regex]::Replace($block, $keyPattern, "$Key=$Value", 1)
              } else {
                $block = $block.TrimEnd([char[]]"`r`n") + "`r`n$Key=$Value`r`n"
              }

              return $Content.Substring(0, $match.Index) +
                $block +
                $Content.Substring($match.Index + $match.Length)
            }

            return $Content.TrimEnd() + "`r`n`r`n[$Section]`r`n$Key=$Value`r`n"
          }

          $iniText = Get-Content -LiteralPath $iniPath -Raw

          $settings = @(
            @{ Key = "SocketConnect";   Value = "1" }
            @{ Key = "HTTPConnect";     Value = "1" }
            @{ Key = "PortNumber";      Value = "5900" }
            @{ Key = "HTTPPortNumber";  Value = "5800" }
            @{ Key = "AutoPortSelect";  Value = "0" }
            @{ Key = "LoopbackOnly";    Value = "1" }
            @{ Key = "AllowLoopback";   Value = "1" }
            @{ Key = "AuthRequired";    Value = "1" }
            @{ Key = "InputsEnabled";   Value = "1" }
          )

          foreach ($setting in $settings) {
            $iniText = Set-IniValue `
              -Content $iniText `
              -Section "admin" `
              -Key $setting.Key `
              -Value $setting.Value
          }

          $utf8NoBom = New-Object System.Text.UTF8Encoding -ArgumentList $false
          [System.IO.File]::WriteAllText($iniPath, $iniText, $utf8NoBom)

          Set-Service -Name $service.Name -StartupType Automatic
          Start-Service -Name $service.Name

          $deadline = (Get-Date).AddSeconds(60)
          $listening = $false

          while ((Get-Date) -lt $deadline) {
            $listening = Test-NetConnection `
              -ComputerName "127.0.0.1" `
              -Port 5800 `
              -InformationLevel Quiet `
              -WarningAction SilentlyContinue

            if ($listening) {
              break
            }

            Start-Sleep -Seconds 2
          }

          if (-not $listening) {
            throw "UltraVNC web viewer did not start listening on port 5800."
          }

          Write-Host "UltraVNC browser viewer is listening locally on port 5800."

      - name: Start protected Cloudflare Quick Tunnel
        shell: powershell
        env:
          CF_EMAIL: ${{ secrets.CF_EMAIL }}
        run: |
          $ErrorActionPreference = "Stop"

          $email = $env:CF_EMAIL

          if ([string]::IsNullOrWhiteSpace($email) -or $email -notmatch '^[^@\s]+@[^@\s]+\.[^@\s]+$') {
            throw "Set CF_EMAIL to an email address you can access."
          }

          $webReady = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 5800 `
            -InformationLevel Quiet `
            -WarningAction SilentlyContinue

          if (-not $webReady) {
            throw "The local browser viewer is not reachable."
          }

          $cloudflared = Join-Path $env:TEMP "cloudflared.exe"
          $downloadUrl = "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"

          Invoke-WebRequest -Uri $downloadUrl -OutFile $cloudflared

          Write-Host ""
          Write-Host "Starting the protected temporary tunnel."
          Write-Host "Watch the following output for your trycloudflare.com URL."
          Write-Host "Cloudflare will require an email PIN before granting access."
          Write-Host ""

          & $cloudflared tunnel `
            --no-autoupdate `
            --url "http://127.0.0.1:5800" `
            --allowed-mail "$email"

          if ($LASTEXITCODE -ne 0) {
            throw "Cloudflare Tunnel exited with an error."
          }
