
name: Windows Development and Tests

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Inspect project and detect languages
        id: detect
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== Windows runner ==="
          Write-Host "OS: $([System.Environment]::OSVersion.VersionString)"
          Write-Host "PowerShell: $($PSVersionTable.PSVersion)"

          Write-Host "`n=== Repository root ==="
          Get-ChildItem -Force |
            Select-Object Mode, Length, Name |
            Format-Table -AutoSize

          $files = Get-ChildItem -Path . -Recurse -File `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -notmatch '[\\/](node_modules|\.git|bin|obj|\.venv|dist|build)[\\/]'
            }

          $node = Test-Path "package.json"
          $python = (
            (Test-Path "requirements.txt") -or
            (Test-Path "pyproject.toml") -or
            ($files.Extension -contains ".py")
          )

          $solution = $files |
            Where-Object { $_.Extension -in @(".sln", ".slnx", ".csproj") } |
            Select-Object -First 1

          $dotnet = $null -ne $solution

          "node=$("$node".ToLower())" >> $env:GITHUB_OUTPUT
          "python=$("$python".ToLower())" >> $env:GITHUB_OUTPUT
          "dotnet=$("$dotnet".ToLower())" >> $env:GITHUB_OUTPUT

          Write-Host "`n=== Detected project files ==="

          $files |
            Where-Object {
              $_.Name -match '^(package\.json|package-lock\.json|pnpm-lock\.yaml|yarn\.lock|requirements\.txt|pyproject\.toml|pytest\.ini|.*\.slnx?|.*\.csproj)$'
            } |
            Select-Object -ExpandProperty FullName

          Write-Host "`nNode.js project: $node"
          Write-Host "Python project: $python"
          Write-Host ".NET project: $dotnet"

          if (-not ($node -or $python -or $dotnet)) {
            Write-Host "::warning::No recognized Node.js, Python, or .NET project detected. Inspect the file list to determine the correct test commands."
          }

      - name: Set up Node.js
        if: steps.detect.outputs.node == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install and test Node.js project
        if: steps.detect.outputs.node == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:CI = "true"

          $package = Get-Content package.json -Raw | ConvertFrom-Json

          Write-Host "=== Installing Node.js dependencies ==="

          if (Test-Path "package-lock.json") {
            npm ci
          } elseif (Test-Path "pnpm-lock.yaml") {
            corepack enable
            if ($LASTEXITCODE -ne 0) { throw "Could not enable Corepack." }
            corepack pnpm install --frozen-lockfile
          } elseif (Test-Path "yarn.lock") {
            corepack enable
            if ($LASTEXITCODE -ne 0) { throw "Could not enable Corepack." }

            if ($package.packageManager -match '^yarn@1\.') {
              corepack yarn install --frozen-lockfile
            } else {
              corepack yarn install --immutable
            }
          } else {
            npm install
          }

          if ($LASTEXITCODE -ne 0) {
            throw "Dependency installation failed."
          }

          $scripts = $package.scripts
          if ($null -eq $scripts) {
            Write-Host "No npm scripts are declared."
            exit 0
          }

          foreach ($name in @("test", "lint", "build")) {
            $script = $scripts.PSObject.Properties[$name]

            if ($null -ne $script) {
              Write-Host "`n=== Running $name ==="
              npm run $name

              if ($LASTEXITCODE -ne 0) {
                throw "The npm '$name' script failed with exit code $LASTEXITCODE."
              }
            } else {
              Write-Host "Skipping '$name': no such script in package.json."
            }
          }

      - name: Set up Python
        if: steps.detect.outputs.python == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install and test Python project
        if: steps.detect.outputs.python == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed." }

          if (Test-Path "requirements.txt") {
            python -m pip install -r requirements.txt
            if ($LASTEXITCODE -ne 0) { throw "Python dependency installation failed." }
          } elseif (Test-Path "pyproject.toml") {
            python -m pip install -e .
            if ($LASTEXITCODE -ne 0) { throw "Python project installation failed." }
          }

          $tests = Get-ChildItem -Path . -Recurse -File `
            -Include "test_*.py", "*_test.py" `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -notmatch '[\\/](node_modules|\.git|\.venv|dist|build)[\\/]'
            }

          if (@($tests).Count -gt 0) {
            python -m pip install pytest
            if ($LASTEXITCODE -ne 0) { throw "Could not install pytest." }

            python -m pytest -q
            if ($LASTEXITCODE -ne 0) { throw "Python tests failed." }
          } else {
            Write-Host "No standard Python test files were detected."
          }

      - name: Test .NET project
        if: steps.detect.outputs.dotnet == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          dotnet --info
          if ($LASTEXITCODE -ne 0) { throw ".NET SDK unavailable." }

          $solution = Get-ChildItem -Path . -Recurse -File `
            -Include "*.sln", "*.slnx" |
            Where-Object {
              $_.FullName -notmatch '[\\/](bin|obj|\.git)[\\/]'
            } |
            Select-Object -First 1

          if ($solution) {
            Write-Host "Testing solution: $($solution.FullName)"
            dotnet test $solution.FullName --configuration Release
          } else {
            $project = Get-ChildItem -Path . -Recurse -File `
              -Filter "*.csproj" |
              Where-Object {
                $_.FullName -notmatch '[\\/](bin|obj|\.git)[\\/]'
              } |
              Select-Object -First 1

            if ($project) {
              Write-Host "Testing project: $($project.FullName)"
              dotnet test $project.FullName --configuration Release
            } else {
              throw "No .NET solution or project found."
            }
          }

          if ($LASTEXITCODE -ne 0) {
            throw ".NET build or tests failed."
          }

      - name: Finished
        if: success()
        shell: pwsh
        run: |
          Write-Host "All applicable detected project checks finished successfully."
          Write-Host "Review the earlier steps to see which tests actually ran."
